name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: e2b-speedlab-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android NDK r28b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: false

      - name: Download official LiteRT-LM 0.17.0 Android ARM64 C API
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request

          metadata_url = "https://pypi.org/pypi/litert-lm-api/0.17.0/json"
          with urllib.request.urlopen(metadata_url) as response:
              metadata = json.load(response)

          wanted = "litert_lm_api-0.17.0-py3-none-android_23_arm64_v8a.whl"
          candidates = [item for item in metadata["urls"] if item["filename"] == wanted]
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one {wanted}, found {len(candidates)}")

          wheel = pathlib.Path("/tmp/litert-lm-api-android-arm64.whl")
          urllib.request.urlretrieve(candidates[0]["url"], wheel)
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          expected = "91fdf62721a624a6b91c04228021c6781b1383e7142087deb9fe51acf40df9a1"
          if digest != expected:
              raise SystemExit(f"LiteRT-LM wheel SHA256 mismatch: {digest}")
          print(f"Verified {wanted}: {digest}")
          PY

          rm -rf /tmp/litert-lm-wheel
          mkdir -p /tmp/litert-lm-wheel
          unzip -q /tmp/litert-lm-api-android-arm64.whl -d /tmp/litert-lm-wheel

          echo "Native files in official wheel:"
          find /tmp/litert-lm-wheel -type f -name '*.so' -print -exec ls -lh {} \;

          DEST="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"

          CORE_SO="$(find /tmp/litert-lm-wheel -type f -name 'liblitert-lm.so' -print -quit)"
          test -n "$CORE_SO"
          cp "$CORE_SO" "$DEST/liblitert-lm.so"

          # Copy native dependencies shipped in the same official Android wheel, but never replace
          # LiteRT-LM's Maven JNI bridge. Extreme mode and the normal Kotlin path stay independent.
          while IFS= read -r SO; do
            NAME="$(basename "$SO")"
            case "$NAME" in
              liblitertlm_jni.so|liblitert-lm.so) continue ;;
            esac
            cp -f "$SO" "$DEST/$NAME"
          done < <(find /tmp/litert-lm-wheel -type f -name '*.so')

          echo "Packaged C API payload:"
          ls -lh "$DEST"

          # The previous APK failed exactly because these symbols were absent. Refuse to create an
          # APK unless the dedicated C API library really exports both of them.
          readelf -Ws "$DEST/liblitert-lm.so" | grep -q 'litert_lm_engine_settings_create'
          readelf -Ws "$DEST/liblitert-lm.so" | grep -q 'litert_lm_engine_settings_set_gpu_decode_steps_per_sync'

          echo "C API symbol verification passed."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK native payload
        run: |
          set -euxo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/liblitert-lm.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libe2b_extreme.so'

          rm -rf /tmp/apk-native
          mkdir -p /tmp/apk-native
          unzip -q app/build/outputs/apk/debug/app-debug.apk 'lib/arm64-v8a/liblitert-lm.so' -d /tmp/apk-native
          readelf -Ws /tmp/apk-native/lib/arm64-v8a/liblitert-lm.so | grep -q 'litert_lm_engine_settings_create'
          readelf -Ws /tmp/apk-native/lib/arm64-v8a/liblitert-lm.so | grep -q 'litert_lm_engine_settings_set_gpu_decode_steps_per_sync'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: E2B-SpeedLab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
